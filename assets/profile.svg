<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="ConqDev — Engineering Confidence, Reliability and Velocity">
  <title>ConqDev — Software Engineering Organization</title>
  <defs>
    <!-- Subtle architectural dot grid -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#111111" fill-opacity="0.09" />
    </pattern>

    <!-- Soft card depth -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f2" />
      <stop offset="100%" stop-color="#ecece7" />
    </linearGradient>

    <linearGradient id="accentFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111111" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#111111" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111111" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#111111" stop-opacity="0.01" />
    </linearGradient>

    <style>
      .brand-title {
        font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif;
        font-weight: 400;
        letter-spacing: -0.02em;
      }
      .mono-label {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        letter-spacing: 0.14em;
      }
      .sans-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
        letter-spacing: -0.01em;
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -48; }
      }
      @keyframes pulseRing {
        0%, 100% { transform: scale(1); opacity: 0.35; }
        50% { transform: scale(1.18); opacity: 0.08; }
      }
      @keyframes nodeFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .flow-line {
        stroke-dasharray: 6 6;
        animation: flowDash 2.4s linear infinite;
      }
      .pulse-circle {
        transform-origin: 1050px 210px;
        animation: pulseRing 3.6s ease-in-out infinite;
      }
      .float-slow {
        animation: nodeFloat 5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Main Rounded Card Base -->
  <rect x="0" y="0" width="1280" height="420" rx="22" ry="22" fill="url(#cardGrad)" />
  <rect x="0" y="0" width="1280" height="420" rx="22" ry="22" fill="url(#dotGrid)" />
  <rect x="0.75" y="0.75" width="1278.5" height="418.5" rx="21.25" ry="21.25" fill="none" stroke="#111111" stroke-opacity="0.12" stroke-width="1.5" />

  <!-- Subtle Structural Framing Hairlines -->
  <line x1="64" y1="56" x2="1216" y2="56" stroke="#111111" stroke-opacity="0.08" stroke-width="1" />
  <line x1="64" y1="364" x2="1216" y2="364" stroke="#111111" stroke-opacity="0.08" stroke-width="1" />

  <!-- Top Minimal Metadata Bar -->
  <g transform="translate(64, 38)">
    <circle cx="5" cy="-4" r="4" fill="#10b981" />
    <text x="18" y="0" fill="#111111" fill-opacity="0.65" font-size="11" class="mono-label">SYSTEMS + PLATFORM ENGINEERING</text>
    <text x="1152" y="0" text-anchor="end" fill="#111111" fill-opacity="0.45" font-size="11" class="mono-label">EST. CONFIDENCE // 99.99%</text>
  </g>

  <!-- LEFT SECTION: Minimal Brand Identity -->
  <g transform="translate(64, 155)">
    <!-- Geometric Emblem Mark -->
    <g transform="translate(0, -48)">
      <rect x="0" y="0" width="36" height="36" rx="9" fill="#111111" />
      <path d="M12 18 L16.5 22.5 L25 13.5" fill="none" stroke="#f2f2ef" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="28" cy="8" r="2.2" fill="#10b981" />
    </g>

    <!-- Brand Wordmark -->
    <text x="0" y="54" fill="#111111" font-size="78" class="brand-title">ConqDev</text>

    <!-- Ultra-concise Tagline -->
    <text x="2" y="96" fill="#111111" fill-opacity="0.62" font-size="20" font-weight="400" class="sans-sub">
      Engineering Ideas into Reality
    </text>

    <!-- Minimal Pill Tags -->
    <g transform="translate(0, 128)">
      <rect x="0" y="0" width="96" height="26" rx="13" fill="#111111" fill-opacity="0.05" stroke="#111111" stroke-opacity="0.14" />
      <text x="48" y="16.5" text-anchor="middle" fill="#111111" fill-opacity="0.8" font-size="10.5" class="mono-label">DELIVERY</text>

      <rect x="106" y="0" width="110" height="26" rx="13" fill="#111111" fill-opacity="0.05" stroke="#111111" stroke-opacity="0.14" />
      <text x="161" y="16.5" text-anchor="middle" fill="#111111" fill-opacity="0.8" font-size="10.5" class="mono-label">RELIABILITY</text>

      <rect x="226" y="0" width="96" height="26" rx="13" fill="#111111" fill-opacity="0.05" stroke="#111111" stroke-opacity="0.14" />
      <text x="274" y="16.5" text-anchor="middle" fill="#111111" fill-opacity="0.8" font-size="10.5" class="mono-label">VELOCITY</text>
    </g>
  </g>

  <!-- RIGHT SECTION: Graphical Systems & Release Confidence Architecture -->
  <g transform="translate(40, 0)">
    <!-- Architectural Concentric Orbit Rings -->
    <circle cx="1050" cy="210" r="145" fill="none" stroke="#111111" stroke-opacity="0.06" stroke-width="1" />
    <circle cx="1050" cy="210" r="105" fill="none" stroke="#111111" stroke-opacity="0.09" stroke-width="1" stroke-dasharray="3 5" />
    <circle cx="1050" cy="210" r="65" fill="url(#pulseGrad)" stroke="#111111" stroke-opacity="0.12" stroke-width="1" />

    <!-- Pipeline Connector Paths -->
    <!-- Track 1 (Top) -->
    <path d="M 540 125 C 620 125, 640 165, 720 165 L 860 165 C 910 165, 930 210, 995 210" fill="none" stroke="#111111" stroke-opacity="0.18" stroke-width="1.5" />
    <path d="M 540 125 C 620 125, 640 165, 720 165 L 860 165 C 910 165, 930 210, 995 210" fill="none" stroke="#111111" stroke-opacity="0.55" stroke-width="1.5" class="flow-line" />

    <!-- Track 2 (Center Main Artery) -->
    <line x1="515" y1="210" x2="995" y2="210" stroke="url(#accentFlow)" stroke-width="2.2" />

    <!-- Track 3 (Bottom) -->
    <path d="M 540 295 C 620 295, 640 255, 720 255 L 860 255 C 910 255, 930 210, 995 210" fill="none" stroke="#111111" stroke-opacity="0.18" stroke-width="1.5" />
    <path d="M 540 295 C 620 295, 640 255, 720 255 L 860 255 C 910 255, 930 210, 995 210" fill="none" stroke="#111111" stroke-opacity="0.55" stroke-width="1.5" class="flow-line" />

    <!-- Stage 1: Modular Source / Velocity Nodes -->
    <g transform="translate(500, 107)">
      <rect x="0" y="0" width="44" height="36" rx="8" fill="#f7f7f5" stroke="#111111" stroke-opacity="0.22" stroke-width="1.2" />
      <line x1="11" y1="13" x2="27" y2="13" stroke="#111111" stroke-width="1.8" stroke-linecap="round" />
      <line x1="11" y1="22" x2="33" y2="22" stroke="#111111" stroke-opacity="0.45" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <g transform="translate(475, 192)">
      <rect x="0" y="0" width="44" height="36" rx="8" fill="#111111" />
      <path d="M16 13 L11 18 L16 23 M28 13 L33 18 L28 23 M24 11 L20 25" fill="none" stroke="#f2f2ef" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <g transform="translate(500, 277)">
      <rect x="0" y="0" width="44" height="36" rx="8" fill="#f7f7f5" stroke="#111111" stroke-opacity="0.22" stroke-width="1.2" />
      <rect x="12" y="11" width="8" height="14" rx="2" fill="#111111" fill-opacity="0.75" />
      <rect x="24" y="15" width="8" height="10" rx="2" fill="#111111" fill-opacity="0.35" />
    </g>

    <!-- Stage 2: Quality & Maintainability Gate Card -->
    <g transform="translate(680, 142)" class="float-slow">
      
      
      <!-- Graphical Verification Bars & Checkmarks -->
      <!-- Row 1 -->
      
      
      

      <!-- Row 2 -->
      

    
    </g>

    <!-- Stage 3: Verified Release Core Shield / Trust Hub -->
    <g>
      <circle cx="1050" cy="210" r="46" fill="#10b981" class="pulse-circle" />
      <circle cx="1050" cy="210" r="42" fill="#111111" />
      <circle cx="1050" cy="210" r="36" fill="none" stroke="#f2f2ef" stroke-opacity="0.18" stroke-width="1" />

      <!-- Shield + Check Icon -->
      <path d="M1050 189 L1066 195.5 V208.5 C1066 219.5 1059.2 228.8 1050 232.5 C1040.8 228.8 1034 219.5 1034 208.5 V195.5 Z" fill="none" stroke="#f2f2ef" stroke-width="2" stroke-linejoin="round" />
      <path d="M1043.5 210.5 L1048 215 L1057 205.5" fill="none" stroke="#10b981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Satellite Reliability Nodes on Outer Orbit -->
    <g>
      <circle cx="1050" cy="105" r="5" fill="#f2f2ef" stroke="#111111" stroke-width="1.8" />
      <circle cx="1155" cy="210" r="5" fill="#10b981" stroke="#111111" stroke-width="1.5" />
      <circle cx="1050" cy="315" r="5" fill="#f2f2ef" stroke="#111111" stroke-width="1.8" />
    </g>
  </g>

  <!-- Bottom Minimal Architectural Telemetry Bar -->
  <g transform="translate(64, 392)">
    <text x="0" y="0" fill="#111111" fill-opacity="0.45" font-size="10.5" class="mono-label">CONQDEV.ORG // ARCHITECTURE • TOOLING • INFRASTRUCTURE</text>
    <g transform="translate(1070, -7)">
      <rect x="0" y="0" width="22" height="4" rx="2" fill="#111111" fill-opacity="0.8" />
      <rect x="28" y="0" width="14" height="4" rx="2" fill="#111111" fill-opacity="0.35" />
      <rect x="48" y="0" width="34" height="4" rx="2" fill="#10b981" />
    </g>
  </g>
</svg>